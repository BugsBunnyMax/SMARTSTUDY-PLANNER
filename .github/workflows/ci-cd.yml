name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:5
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Run ESLint (Backend)
        run: cd backend && npm run lint || true
        continue-on-error: true

      - name: Run ESLint (Frontend)
        run: cd frontend && npm run lint || true
        continue-on-error: true

      - name: Run backend tests
        run: cd backend && npm test -- --coverage --watchAll=false
        env:
          MONGO_URI: mongodb://localhost:27017/smartstudy-test
          JWT_SECRET: test-secret-key-do-not-use
          NODE_ENV: test

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          REACT_APP_API_URL: http://localhost:5000

      - name: Build backend
        run: cd backend && npm run build 2>/dev/null || echo "No build script defined"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false

  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Run npm audit (Backend)
        run: cd backend && npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Run npm audit (Frontend)
        run: cd frontend && npm audit --audit-level=moderate || true
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, security-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: docker-compose build

      - name: Test Docker images
        run: |
          echo "Docker images built successfully"
          docker images | grep smartstudy || echo "Note: Images available but not tagged yet"

  # Deployment jobs (to be configured with Vercel/Render)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to staging
        run: |
          echo "Staging deployment would happen here"
          echo "Configure Render/Vercel webhooks to trigger on develop branch"

  notify-status:
    runs-on: ubuntu-latest
    needs: [test, security-check, docker-build]
    if: always()

    steps:
      - name: Check job status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ All checks passed! Ready to merge."
          else
            echo "❌ Some checks failed. Please review the logs above."
          fi
